# AuraSuite (AuraPitch + AuraKey) — compilation et bancs d'essai à chaque push. VST3 uniquement.
#   macOS  : binaire universel arm64 / x86_64
#   Windows: x64 (MSVC)
#   Linux  : contrôle de portabilité
# Les trois exécutent ctest. Une étiquette v* publie une release.
name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  # Budgets CPU des bancs × 3 : les runners partagés sont 2 à 3× plus lents qu'un poste et leur charge varie.
  AURAPITCH_CPU_SCALE: "3"
  JUCE_TAG: 8.0.15

jobs:
  macos:
    name: macOS (Universal arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ env.JUCE_TAG }}-macos

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config $BUILD_TYPE --parallel 4

      - name: Test
        run: ctest --test-dir build -C $BUILD_TYPE --output-on-failure

      - name: Check universal binaries
        run: |
          lipo -info "build/AuraPitch_artefacts/$BUILD_TYPE/VST3/AuraPitch.vst3/Contents/MacOS/AuraPitch"
          lipo -info "build/AuraKey_artefacts/$BUILD_TYPE/VST3/AuraKey.vst3/Contents/MacOS/AuraKey"

      - name: Package
        run: |
          mkdir -p dist
          for p in AuraPitch AuraKey; do
            (cd "build/${p}_artefacts/$BUILD_TYPE" && ditto -c -k --keepParent VST3/$p.vst3 "$GITHUB_WORKSPACE/dist/$p-macOS-VST3.zip")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: AuraSuite-macOS
          path: dist/*.zip

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ env.JUCE_TAG }}-windows

      - name: Configure
        run: cmake -B build -A x64          # générateur Visual Studio le plus récent du runner

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($p in "AuraPitch", "AuraKey") {
            Compress-Archive -Path "build/${p}_artefacts/${{ env.BUILD_TYPE }}/VST3/$p.vst3" -DestinationPath "dist/$p-Windows-VST3.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: AuraSuite-Windows
          path: dist/*.zip

  linux:
    name: Linux (contrôle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev xvfb ninja-build

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ env.JUCE_TAG }}-linux

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ macos, windows, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
